<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});let data;try{data=await r.json()}catch{throw new Error(`The server returned an invalid response (${r.status}).`)}if(!r.ok)throw new Error(data.msg||data.error||`Request failed (${r.status}).`);return data};
const QR={dmart:['upi://pay?pa=dmart@okicici&pn=DMart Avenue Supermarts&am=640','DMart store'],fake:['upi://pay?pa=dmart-help@okxyz&pn=DMart Avenue Supermarts&am=18500','Fake DMart QR'],link:['http://sbi-kyc-verify.top/pay?pa=rewards@paytmx&pn=SBI Rewards&am=4999','QR with web link'],look:['upi://pay?pa=tneb.biils@sbi&pn=TNEB Electricity Board&am=3200','TNEB bill QR'],shop:['upi://pay?pa=sharma.store@okaxis&pn=Sharma General Store&am=1200','Sharma store']};
let S={v:'lock',pin:'',f:{},bal:null,ctx:{device:'Pixel 7',city:'Chennai',hour:new Date().getHours()}};
const go=v=>{S.v=v;S.pin='';draw()};
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
const load=async()=>S.me=await api('/api/me');
const dots=()=>`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div>`;
const pad=()=>`<div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button ${k===''?'disabled':''} onclick="key('${k}')">${k}</button>`).join('')}</div>`;
function key(k){if(k==='⌫')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;$('.dots').outerHTML=dots();if(S.pin.length===4)setTimeout(submit,150)}
async function submit(){const p=S.pin,v=S.v;
if(v==='lock'){const r=await api('/api/login',{pin:p});if(!r.ok){S.pin='';$('.dots').outerHTML=dots();return $('#er').textContent='Wrong app PIN.'}await load();return go('home')}
if(v==='bal'){const r=await api('/api/balance',{pin:p});if(!r.ok){S.pin='';$('.dots').outerHTML=dots();return $('#er').textContent=r.msg}S.bal=r.bal;return go('home')}
const f=S.f;$('#ov').className='on chk';$('#ov').innerHTML='<div class="spin"></div><b>Processing payment…</b><small>Contacting your bank through the UPI network</small>';
const [r]=await Promise.all([api('/api/pay',{pin:p,payload:f.p,amount:f.amt,bank:f.bank,note:f.note,gid:f.g&&f.g.id,code:f.code,cid:f.cid}),new Promise(z=>setTimeout(z,1300))]);
$('#ov').className='';if(!r.ok&&!r.fatal){S.pin='';draw();return $('#er').textContent=r.msg}f.r=r;await load();go('res')}
function ring(n){const c=326.7;return `<svg width="120" height="120" viewBox="0 0 130 130" style="transform:rotate(-90deg)"><circle cx="65" cy="65" r="52" fill="none" stroke="#555" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="#FFC400" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-n/100)}"/></svg>`}
const init=n=>esc(n).trim().charAt(0).toUpperCase();
function lock(){return `<div style="padding:60px 24px;text-align:center"><div class="av" style="width:64px;height:64px;font-size:30px;margin:auto;background:var(--y);color:var(--ink)">Z</div><h2 style="margin:14px 0 4px">Zippay</h2><p style="color:var(--m)">Enter app PIN</p>${dots()}<div class="er" id="er"></div>${pad()}<p style="color:var(--m);font-size:12px;margin-top:14px">Demo app PIN: 2580 · UPI PIN: 1234</p></div>`}
let installPrompt=null;
const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installCard(){return isInstalled()?'':`<div class="card install-card"><div class="install-mark">↓</div><div><b>Take Zippay with you</b><small>Install for a full-screen app experience</small></div><button class="btn" id="installBtn" onclick="installApp()">Install</button></div>`}
async function installApp(){
if(installPrompt){installPrompt.prompt();const result=await installPrompt.userChoice;installPrompt=null;if(result.outcome==='accepted')toast('Zippay is being installed.');else toast('You can install Zippay whenever you are ready.');return}
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
toast(ios?'In Safari, tap Share, then Add to Home Screen.':'Open your browser menu and choose Install app or Add to Home screen.');
}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;const button=$('#installBtn');if(button)button.textContent='Install'});
function home(){const m=S.me,st=m.hist.filter(h=>h.status.startsWith('Stopped')).length;
return `<div class="hd"><div class="row"><div><small>Welcome back</small><h2>${esc(m.name)}</h2></div><span class="shield ${m.guard.on&&m.guard.online?'':'off'}">${m.guard.demo?'Demo alerts':'PhishGuard'} ${m.guard.on&&m.guard.online?'ON':'OFF'}</span></div><small>${esc(m.vpa)}</small></div>
<div class="card" style="margin-top:-12px"><div class="grid"><button onclick="go('scan')"><i>▣</i>Scan QR</button><button onclick="go('scan')"><i>@</i>To UPI ID</button><button onclick="go('bal')"><i>₹</i>Balance</button><button onclick="go('req')"><i>↙</i>Requests</button></div></div>
${installCard()}
${S.bal?`<div class="card"><h3>Account balances</h3>${Object.entries(S.bal).map(([k,v])=>`<div class="row" style="padding:4px 0"><span>${k}</span><b>${inr(v)}</b></div>`).join('')}</div>`:''}
<div class="card"><h3>People</h3><div class="pp">${m.contacts.map(c=>`<button onclick="start('${c.vpa}','typed')"><div class="av" style="margin:auto">${init(c.name)}</div>${esc(c.name)}</button>`).join('')}</div></div>
${st?`<div class="card" style="background:var(--y)"><b>${m.guard.demo?'Demo alerts automatically stopped':'PhishGuard stopped'} ${st} payment${st>1?'s':''} for review.</b></div>`:''}
<div class="card"><h3>Recent transactions</h3>${txs(m.hist.slice(0,4))}</div>`}
function txs(a){return a.map(h=>`<div class="li"><div class="av" style="background:${h.dr?'var(--b)':'var(--ink)'}">${init(h.name)}</div><div><b>${esc(h.name)}</b><small>${esc(h.time)}${h.utr!=='-'?' · UTR '+h.utr:''}</small></div><div style="text-align:right"><b>${h.dr?'-':''}${inr(h.amount)}</b><br><span class="pill ${h.dr?'':'s'}">${h.status}</span></div></div>`).join('')||'<small>No transactions yet.</small>'}
function scan(){return `<div class="hd"><button class="back" onclick="go('home')">← Back</button><h2>Scan QR or pay</h2></div><div class="vf"><span></span></div>
<div class="card"><h3>Try a demo QR</h3><div class="chips">${Object.entries(QR).map(([k,v])=>`<button onclick="start(QR.${k}[0],'qr')">${v[1]}</button>`).join('')}</div></div>
<div class="card"><h3>Or enter UPI ID, mobile number, or paste QR text</h3><input id="to" placeholder="name@bank or 9876543210"><button class="btn" style="margin-top:10px" onclick="start($('#to').value,'typed')">Continue</button></div>`}
async function start(p,src,cid){const info=await api('/api/resolve',{payload:p});S.f={p,src,cid,info,bank:S.me.banks[0],amt:info.amount||'',note:''};go('amt')}
function amt(){const f=S.f,i=f.info,ok=i.registered&&i.name.toLowerCase().includes(i.registered.split(' ')[0].toLowerCase());
return `<div class="hd"><button class="back" onclick="go('scan')">← Back</button><div class="row" style="justify-content:flex-start"><div class="av" style="background:#fff;color:var(--b)">${init(i.name)}</div><div><h2 style="font-size:18px">${esc(i.name)}</h2><small>${esc(i.vpa||'No UPI ID in this code')}</small></div></div></div>
<div class="card"><small style="color:var(--m)">Banking name</small><div><b>${esc(i.registered||'Not verified')}</b> <span class="pill ${i.registered?'':'s'}">${i.registered?'Verified by bank':'Unverified'}</span></div></div>
<div class="card"><input class="amt" id="amt" type="number" placeholder="₹0" value="${esc(f.amt)}"><input id="note" placeholder="Add a note" style="margin:12px 0"><select id="bank">${S.me.banks.map(b=>`<option>${b}</option>`).join('')}</select></div>
<div style="padding:0 14px"><button class="btn" onclick="check()">Proceed to pay</button></div>`}
async function check(){const f=S.f;f.amt=$('#amt').value;f.note=$('#note').value;f.bank=$('#bank').value;delete f.code;
$('#ov').className='on chk';$('#ov').innerHTML=`<div class="spin"></div><b>${S.me.guard.demo?'Running the demo safety check…':'PhishGuard is checking this payment…'}</b><small>QR, UPI ID, merchant, amount, and your usual pattern</small>`;
try{const [r]=await Promise.all([api('/api/precheck',{payload:f.p,amount:f.amt,bank:f.bank,src:f.src,ctx:S.ctx}),new Promise(z=>setTimeout(z,900))]);
if(r.err){$('#ov').className='';return toast(r.err)}f.g=r.guard;f.off=r.offline;if(r.msg)toast('PhishGuard unreachable: '+r.msg);
if(!r.guard||r.guard.level==='low'){$('#ov').className='';return go('pin')}alertUI(r.guard)}
catch(error){console.error('Payment safety pre-check failed:',error);$('#ov').className='';toast(error.message||'The safety check failed. Please try again.')}}
const li=r=>`<li><b>${esc(r.title)}</b><span>${esc(r.why)}</span><i style="width:${Math.min(100,r.w*3)}%"></i></li>`;
const vt=v=>'<table>'+Object.entries(v).map(([k,x])=>`<tr><td>${k}</td><td>${esc(x)}</td></tr>`).join('')+'</table>';
function alarm(hi){if(navigator.vibrate)navigator.vibrate(hi?[120,70,120,70,220]:[80])}
function alertUI(g){const extra=g.level==='extra-high',hi=extra||g.level==='high';$('#ov').className='on '+(extra?'extra':hi?'hi':'md');
$('#ov').innerHTML=`<div class="card2" role="dialog" aria-modal="true" aria-labelledby="risk-title"><div class="bar" id="risk-title">${extra?'EXTRA HIGH · PAYMENT CUT OFF':g.blocked&&g.source==='demo'?'High demo alert · Payment stopped':hi?'Payment paused · High risk':'A quick safety check'}</div><div class="row" style="justify-content:flex-start;gap:14px">${ring(g.score)}<div><h2>${g.score}<small style="font-size:15px;color:var(--m)"> / 100 risk</small></h2><p>${g.blocked?'This high-risk payment was stopped automatically. No PIN was requested.':hi?'We recommend cancelling this payment.':'Review the details before continuing.'}</p></div></div>
<p style="font-weight:700;margin-top:14px">What we noticed</p><ul class="rs">${g.reasons.slice(0,4).map(li).join('')}</ul>${vt(g.verify)}
${g.source==='demo'?'<div class="sms"><b>Simulated demo alert:</b> this is not a real fraud check and does not contact your bank.</div>':g.source==='local'?'<div class="sms">PhishGuard is offline. This warning is based on local demo checks.</div>':''}${g.blocked?`<p style="margin:12px 0;font-weight:700">${extra?'The URL risk triggered an automatic stop. This payment cannot continue.':g.source==='demo'?'This payment cannot continue.':'PhishGuard blocked this payment.'}</p>`:g.needs_code?`<div class="sms">PhishGuard needs one more check. Enter the 6-digit code it sent you.</div><input id="cd" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code">`:`<label class="ck"><input type="checkbox" id="ck"> I checked the merchant name and ID</label>`}
<div style="display:grid;gap:10px;margin-top:12px"><button class="btn y" onclick="${g.blocked?'dismissRisk()':'stop()'}">${g.blocked?'Done · payment stopped':'Cancel and keep money safe'}</button>${g.blocked?'':`<button class="btn o" onclick="cont()">${g.needs_code?'Verify and continue':'I understand · Continue'}</button>`}</div><p class="er" id="er2" style="color:var(--y)"></p></div>`;alarm(hi)}
async function cont(){const g=S.f.g;if(g.blocked)return;if(!g.needs_code&&!$('#ck').checked)return $('#er2').textContent='Tick the box after checking the merchant.';
if(g.needs_code){S.f.code=$('#cd').value;const x=await api('/api/gverify',{gid:g.id,code:S.f.code,payload:S.f.p,amount:S.f.amt});if(!x.ok)return $('#er2').textContent=x.msg||'Wrong code. The payment stays paused.'}$('#ov').className='';go('pin')}
async function stop(){const f=S.f;await api('/api/cancel',{gid:f.g.id,payload:f.p,amount:f.amt,bank:f.bank});await load();$('#ov').className='';go('home');toast('Payment stopped. Your money is safe.')}
async function dismissRisk(){await load();$('#ov').className='';go('home');toast('High-risk demo payment stopped automatically.')}
function pin(){const f=S.f,g=f.g;return `<div class="hd" style="text-align:center"><small>Paying ${esc(f.info.name)}</small><h2 style="font-size:34px">${inr(f.amt)}</h2><small>${f.bank}</small><div style="margin-top:8px"><span class="shield ${g?'':'off'}">${g?(g.source==='demo'?'Demo alert · score ':'PhishGuard checked · score ')+g.score:f.off?'PhishGuard offline':'PhishGuard off'}</span></div></div><p style="text-align:center;margin-top:16px">Enter UPI PIN</p>${dots()}<div class="er" id="er"></div>${pad()}`}
function res(){const r=S.f.r,t=r.txn;return r.ok?`<div style="padding:20px;text-align:center"><div class="ok">✓</div><h2>Payment successful</h2><h1 style="margin:8px 0">${inr(t.amount)}</h1><p>Paid to ${esc(t.name)}</p><div class="card" style="text-align:left"><table><tr><td>UPI ID</td><td>${esc(t.vpa)}</td></tr><tr><td>From</td><td>${t.bank}</td></tr><tr><td>UTR</td><td>${t.utr}</td></tr><tr><td>Time</td><td>${t.time}</td></tr></table></div><button class="btn" onclick="go('home')">Done</button></div>`
:`<div style="padding:20px;text-align:center"><div class="ok x">!</div><h2>Payment failed</h2><p style="margin:10px 0">${esc(r.msg)}</p><small>Error code ${r.code}</small><div style="margin-top:20px"><button class="btn" onclick="go('home')">Back to home</button></div></div>`}
function hist(){return `<div class="hd"><h2>History</h2><small>Daily UPI limit used: ${inr(S.me.spent)} of ${inr(S.me.limit)}</small></div><div class="card">${txs(S.me.hist)}</div>`}
function req(){return `<div class="hd"><h2>Payment requests</h2><small>Never approve a request to receive money</small></div>${S.me.collect.map(c=>`<div class="card"><div class="row"><b>${esc(c.from)}</b><b>${inr(c.amount)}</b></div><small style="color:var(--m)">${esc(c.vpa)}</small><p style="margin:8px 0">${esc(c.note)}</p><div class="row"><button class="btn g" onclick="dc(${c.id})">Decline</button><button class="btn" onclick="start('${c.payload}','qr',${c.id})">Pay</button></div></div>`).join('')||'<div class="card">No pending requests.</div>'}`}
async function dc(id){await api('/api/collect/decline',{id});await load();draw()}
function prof(){const m=S.me,g=m.guard;return `<div class="hd"><div class="row" style="justify-content:flex-start"><div class="av" style="background:#fff;color:var(--b)">${init(m.name)}</div><div><h2>${esc(m.name)}</h2><small>${esc(m.mobile)} · ${esc(m.vpa)}</small></div></div></div>
<div class="card"><h3>Bank accounts</h3>${m.banks.map(b=>`<div class="li"><div><b>${b}</b></div><span class="pill">Linked</span></div>`).join('')}</div>
<div class="card"><div class="row"><div><b>${g.demo?'Simulated demo alerts':'PhishGuard extension'}</b><br><small style="color:var(--m)">${g.demo?'Local simulated warnings; not real fraud detection.':g.online?'Connected to the PhishGuard service':'Cannot reach it. Check PHISHGUARD_URL'}</small></div><button class="btn ${g.on?'y':'g'}" style="width:auto;padding:10px 16px" ${g.demo?'disabled title="Demo alerts are always enabled"':''} onclick="tg()">${g.on?'ON':'OFF'}</button></div></div>
<div class="card"><h3>Demo controls (simulate this phone)</h3><select id="dv" onchange="S.ctx.device=this.value" style="margin-bottom:8px"><option ${S.ctx.device=='Pixel 7'?'selected':''}>Pixel 7</option><option ${S.ctx.device!='Pixel 7'?'selected':''}>Unknown Android</option></select><select onchange="S.ctx.city=this.value" style="margin-bottom:8px">${['Chennai','Delhi','Lagos'].map(c=>`<option ${S.ctx.city==c?'selected':''}>${c}</option>`).join('')}</select><input type="number" min="0" max="23" value="${S.ctx.hour}" onchange="S.ctx.hour=+this.value"></div>
<div class="card"><h3>Report a suspicious UPI ID</h3><input id="rv" placeholder="scammer@okxyz" style="margin-bottom:8px"><button class="btn y" onclick="rp()">Report</button></div>`}
async function tg(){await api('/api/settings',{guard:!S.me.guard.on});await load();draw()}
async function rp(){const x=await api('/api/report',{vpa:$('#rv').value,reason:'User report'});toast(x.msg)}
function draw(){const m=S.me,v=S.v,V={lock,home,scan,amt,pin,res,hist,req,prof,bal:()=>`<div class="hd"><button class="back" onclick="go('home')">← Back</button><h2>Check balance</h2></div><p style="text-align:center;margin-top:20px">Enter UPI PIN</p>${dots()}<div class="er" id="er"></div>${pad()}`};
$('#scr').innerHTML=V[v]();const show=['home','hist','req','prof'].includes(v);$('#nv').style.display=show?'flex':'none';
if(show)$('#nv').innerHTML=[['home','Home'],['hist','History'],['scan','Scan'],['req','Requests'],['prof','Profile']].map(([k,l])=>`<button class="${v===k?'on':''}" onclick="go('${k}')">${l}${k==='req'&&m.collect.length?`<b>${m.collect.length}</b>`:''}</button>`).join('');mon()}
async function mon(){const g=await api('/api/guardlog');$('#mon').innerHTML=`<h3>${g.demo?'Demo safety alerts':'PhishGuard extension'}</h3><p style="color:var(--m);margin:6px 0 12px;font-size:13px">${g.demo?'Simulated locally for every payment option. These are not real fraud checks.':'The PhishGuard service behind the app-debug.apk. Zippay calls it before every payment.'}</p><span class="shield ${g.online?'':'off'}">${g.demo?'Simulation active':g.online?'Connected':'Offline'}</span><div style="margin-top:12px">${g.log.map(l=>`<div class="li"><div><b>${esc(l.vpa)}</b><small>${l.time} · ${l.ms} ms</small></div><b>${l.score??'-'}</b></div>`).join('')||'<small style="color:var(--m)">No checks yet.</small>'}</div>`}
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('Zippay was added to your device.')});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(error=>console.error('Could not register the app service worker:',error));
draw();setInterval(mon,4000);
</script></body></html>
