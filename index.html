/* ===== Floaty, airy skin (same blue / yellow palette) ===== */
:root{--bg:#f3f7ff;--sky:#dfeaff;--ease:cubic-bezier(.22,1,.36,1)}

/* play-money wallet */
.wal{background:linear-gradient(140deg,#fff,#eaf1ff 60%,#fff3cf);position:relative;overflow:hidden}
.wal:before{content:"₹";position:absolute;right:-8px;top:-30px;font:800 150px/1 sans-serif;color:rgba(36,95,232,.06)}
.wal .big{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--b2)}
.wal .tag{display:inline-block;background:var(--y);border-radius:99px;font-size:11px;font-weight:700;padding:3px 10px;margin-left:6px;color:var(--ink)}
.wal button.rs{background:none;border:0;color:var(--b);font-weight:600;font-size:12px;cursor:pointer;padding:6px 0 0}
/* transfer scene */
#ov.xfer{background:linear-gradient(160deg,rgba(36,95,232,.93),rgba(74,139,255,.9));flex-direction:column;color:#fff;text-align:center}
.xf{width:min(100%,520px)}

.xrow{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;margin:26px 0 18px;position:relative}
.bk{background:#fff;color:var(--ink);border-radius:24px;padding:16px 10px;box-shadow:0 18px 40px rgba(8,25,70,.3);animation:float 4s ease-in-out infinite}
.bk+.lane+.bk{animation-delay:-2s}
.bk small{display:block;color:var(--m);font-size:11px}.bk b{display:block;font-size:13px;margin:2px 0}.bk .n{font-size:20px;font-weight:800;color:var(--b2);margin-top:8px}
.bk.gain{animation:pop .5s var(--ease)}.bk.gain .n{color:#12915a}

async function start(p,src,cid){stopCamera();const info=await api('/api/resolve',{payload:p});S.f={p,src,cid,info,bank:S.me.banks.includes(S.pref)?S.pref:S.me.banks[0],amt:info.amount||'',note:'',cat:info.cat||'Misc'};go('amt')}
function amt(){const f=S.f,i=f.info,ok=i.registered&&i.name.toLowerCase().includes(i.registered.split(' ')[0].toLowerCase());
return `<div class="hd"><button class="back" onclick="go('scan')">← Back</button><div class="row" style="justify-content:flex-start"><div class="av avw">${init(i.name)}</div><div><h2 style="font-size:18px">${esc(i.name)}</h2><small>${esc(i.vpa||'No UPI ID in this code')}</small></div></div></div>
<div class="card"><small style="color:var(--m)">Banking name</small><div><b>${esc(i.registered||'Not verified')}</b> <span class="pill ${i.registered?'':'s'}">${i.registered?'Verified by bank':'Unverified'}</span></div></div>
<div class="card"><input class="amt" id="amt" type="number" placeholder="₹0" value="${esc(f.amt)}"><input id="note" placeholder="Add a note" style="margin:12px 0"><select id="bank">${S.me.banks.map(b=>`<option ${b===f.bank?'selected':''}>${b}</option>`).join('')}</select><button class="lnk" onclick="addBank()">+ Add bank account</button><h3 style="margin:12px 0 4px">Category</h3><div class="chips2 wrapc">${Object.keys(CAT).map(k=>`<button class="${f.cat===k?'on':''}" style="--cb:${CAT[k][0]};--cf:${CAT[k][1]}" onclick="pickCat('${k}')">${ICO[k]} ${k}</button>`).join('')}</div></div>
<div style="padding:0 14px"><button class="btn" onclick="check()">Proceed to pay</button></div>`}
async function check(){const f=S.f;f.amt=$('#amt').value;f.note=$('#note').value;f.bank=$('#bank').value;S.pref=f.bank;delete f.code;
$('#ov').className='on chk';$('#ov').innerHTML=`<div class="spin"></div><b>${S.me.guard.demo?'Running the demo safety check…':'PhishGuard is checking this payment…'}</b><small>QR, UPI ID, merchant, amount, and your usual pattern</small>`;
try{const [r]=await Promise.all([api('/api/precheck',{payload:f.p,amount:f.amt,bank:f.bank,src:f.src,note:f.note,ctx:S.ctx}),new Promise(z=>setTimeout(z,900))]);
if(r.err){$('#ov').className='';return toast(r.err)}f.g=r.guard;f.off=r.offline;if(r.msg)toast('PhishGuard unreachable: '+r.msg);
if(!r.guard||r.guard.level==='low'){$('#ov').className='';return go('pin')}alertUI(r.guard)}
catch(error){console.error('Payment safety pre-check failed:',error);$('#ov').className='';toast(error.message||'The safety check failed. Please try again.')}}
const li=r=>`<li><b>${esc(r.title)}</b><span>${esc(r.why)}</span><i style="width:${Math.min(100,r.w*3)}%"></i></li>`;
const vt=v=>'<table>'+Object.entries(v).map(([k,x])=>`<tr><td>${k}</td><td>${esc(x)}</td></tr>`).join('')+'</table>';
function alarm(hi){if(navigator.vibrate)navigator.vibrate(hi?[120,70,120,70,220]:[80])}
function alertUI(g){const extra=g.level==='extra-high',hi=extra||g.level==='high';$('#ov').className='on '+(extra?'extra':hi?'hi':'md');
$('#ov').innerHTML=`<div class="card2" role="dialog" aria-modal="true" aria-labelledby="risk-title"><div class="bar" id="risk-title">${g.loan&&g.loan.flag&&g.blocked?'FAKE LOAN SUSPECTED · PAYMENT STOPPED':extra?'EXTRA HIGH · PAYMENT CUT OFF':g.blocked&&g.source==='demo'?'High demo alert · Payment stopped':hi?'Payment paused · High risk':'A quick safety check'}</div><div class="row" style="justify-content:flex-start;gap:14px">${ring(g.score)}<div><h2>${g.score}<small style="font-size:15px;color:var(--m)"> / 100 risk</small></h2><p>${g.blocked?'This high-risk payment was stopped automatically. No PIN was requested.':hi?'We recommend cancelling this payment.':'Review the details before continuing.'}</p></div></div>
<p style="font-weight:700;margin-top:14px">What we noticed</p><ul class="rs">${g.reasons.slice(0,5).map(li).join('')}</ul>${vt(g.verify)}${loanTip(g)}
${g.source==='demo'?'<div class="sms"><b>Simulated demo alert:</b> this is not a real fraud check and does not contact your bank.</div>':g.source==='local'?'<div class="sms">PhishGuard is offline. This warning is based on local demo checks.</div>':''}${g.blocked?`<p style="margin:12px 0;font-weight:700">${extra?'The URL risk triggered an automatic stop. This payment cannot continue.':g.source==='demo'?'This payment cannot continue.':'PhishGuard blocked this payment.'}</p>`:g.needs_code?`<div class="sms">PhishGuard needs one more check. Enter the 6-digit code it sent you.</div><input id="cd" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code">`:`<label class="ck"><input type="checkbox" id="ck"> I checked the merchant name and ID</label>`}
<div style="display:grid;gap:10px;margin-top:12px"><button class="btn y" onclick="${g.blocked?'dismissRisk()':'stop()'}">${g.blocked?'Done · payment stopped':'Cancel and keep money safe'}</button>${g.blocked?'':`<button class="btn o" onclick="cont()">${g.needs_code?'Verify and continue':'I understand · Continue'}</button>`}</div><p class="er" id="er2"></p></div>`;alarm(hi)}
async function cont(){const g=S.f.g;if(g.blocked)return;if(!g.needs_code&&!$('#ck').checked)return $('#er2').textContent='Tick the box after checking the merchant.';
if(g.needs_code){S.f.code=$('#cd').value;const x=await api('/api/gverify',{gid:g.id,code:S.f.code,payload:S.f.p,amount:S.f.amt});if(!x.ok)return $('#er2').textContent=x.msg||'Wrong code. The payment stays paused.'}$('#ov').className='';go('pin')}
async function stop(){const f=S.f;await api('/api/cancel',{gid:f.g.id,payload:f.p,amount:f.amt,bank:f.bank});await load();$('#ov').className='';go('home');toast('Payment stopped. Your money is safe.')}
async function dismissRisk(){await load();$('#ov').className='';go('home');toast('High-risk demo payment stopped automatically.')}
function pin(){const f=S.f,g=f.g;return `<div class="hd" style="text-align:center"><small>Paying ${esc(f.info.name)}</small><h2 style="font-size:34px">${inr(f.amt)}</h2><small>${f.bank}</small><div style="margin-top:8px"><span class="shield ${g?'':'off'}">${g?(g.source==='demo'?'Demo alert · score ':'PhishGuard checked · score ')+g.score:f.off?'PhishGuard offline':'PhishGuard off'}</span></div></div><p style="text-align:center;margin-top:16px">Enter UPI PIN</p>${dots()}<div class="er" id="er"></div>${pad()}`}
function res(){const r=S.f.r,t=r.txn;return r.ok?`<div style="padding:20px;text-align:center"><div class="ok"><svg viewBox="0 0 48 48"><path d="M12 25l8 8 16-18"/></svg></div><h2>Payment successful</h2><h1 style="margin:8px 0">${inr(t.amount)}</h1><p>Paid to ${esc(t.name)}</p>${r.move?`<div class="mv"><div><small>Your ${esc(r.move.from_bank)}</small><s>${inr(r.move.from_before)}</s><b>${inr(r.move.from_after)}</b></div><div class="up"><small>Sent to ${esc(t.name)}</small><b>${inr(r.move.amount)}</b></div></div>`:''}<div class="card" style="text-align:left"><table><tr><td>UPI ID</td><td>${esc(t.vpa)}</td></tr><tr><td>From</td><td>${t.bank}</td></tr><tr><td>Category</td><td>${t.cat||'Misc'}</td></tr><tr><td>UTR</td><td>${t.utr}</td></tr><tr><td>Time</td><td>${t.time}</td></tr></table></div><button class="btn" onclick="go('home')">Done</button></div>`
:`<div style="padding:20px;text-align:center"><div class="ok x">!</div><h2>Payment failed</h2><p style="margin:10px 0">${esc(r.msg)}</p><small>Error code ${r.code}</small><div style="margin-top:20px"><button class="btn" onclick="go('home')">Back to home</button></div></div>`}
function hist(){return `<div class="hd"><h2>History</h2><small>Daily UPI limit used: ${inr(S.me.spent)} of ${inr(S.me.limit)}</small></div><div class="card">${txs(S.me.hist)}</div>`}
function req(){const m=S.me,sent=m.sent||[];return `<div class="hd"><h2>Payment requests</h2><small>Never approve a request to receive money</small></div>
<div class="card"><div class="row"><div><b>Ask for money</b><br><small style="color:var(--m)">Send a request to someone you know</small></div><button class="btn" style="width:auto;padding:10px 16px" onclick="reqForm()">+ Request</button></div></div>
${m.collect.length?'<h3 class="sec">To pay</h3>':''}${m.collect.map(c=>`<div class="card"><div class="row"><b>${esc(c.from)}</b><b>${inr(c.amount)}</b></div><small style="color:var(--m)">${esc(c.vpa)}</small><p style="margin:8px 0">${esc(c.note)}</p><div class="row"><button class="btn g" onclick="dc(${c.id})">Decline</button><button class="btn" onclick="start('${c.payload}','qr',${c.id})">Pay</button></div></div>`).join('')}
${sent.length?'<h3 class="sec">You requested</h3>':''}${sent.map(s=>{const c=SC[s.status];return `<div class="card"><div class="row"><b>${esc(s.name)}</b><b>${inr(s.amount)}</b></div><small style="color:var(--m)">${esc(s.vpa)} · ${esc(s.time)}</small>${s.note?`<p style="margin:8px 0">${esc(s.note)}</p>`:''}<div class="row" style="margin-top:8px"><span class="pill sc-${s.status}">${s.status}</span>${s.status==='Pending'?`<span><button class="lnk" onclick="cancelReq(${s.id})">Cancel</button><button class="lnk" onclick="settleReq(${s.id})">Demo: they paid</button></span>`:''}</div></div>`}).join('')}
${!m.collect.length&&!sent.length?'<div class="card">No requests yet.</div>':''}`}
async function dc(id){await api('/api/collect/decline',{id});await load();draw()}
function prof(){const m=S.me,g=m.guard;return `<div class="hd"><div class="row" style="justify-content:flex-start"><div class="av pav avw" onclick="editProfile()">${AV()}<span class="pen">✎</span></div><div><h2>${esc(m.name)}</h2><small>${esc(m.mobile)} · ${esc(m.vpa)}</small><br><button class="lnk" style="color:#fff;padding:4px 0" onclick="editProfile()">✎ Edit profile</button></div></div></div>
<div class="card"><div class="row"><div><b>Appearance</b><br><small style="color:var(--m)">Choose light or dark</small></div><div class="seg"><button class="${dark()?'':'on'}" onclick="setTheme('light')">☀️ Light</button><button class="${dark()?'on':''}" onclick="setTheme('dark')">🌙 Dark</button></div></div></div>
<div class="card"><div class="row"><h3>Bank accounts</h3><button class="lnk" onclick="addBank()">+ Add</button></div>${m.banks.map(b=>`<div class="li"><div><b>${b}</b></div><span class="pill">Linked</span></div>`).join('')}</div>
<div class="card"><div class="row"><div><b>${g.demo?'Simulated demo alerts':'PhishGuard extension'}</b><br><small style="color:var(--m)">${g.demo?'Local simulated warnings; not real fraud detection.':g.online?'Connected to the PhishGuard service':'Cannot reach it. Check PHISHGUARD_URL'}</small></div><button class="btn ${g.on?'y':'g'}" style="width:auto;padding:10px 16px" ${g.demo?'disabled title="Demo alerts are always enabled"':''} onclick="tg()">${g.on?'ON':'OFF'}</button></div></div>
<div class="card"><h3>Demo controls (simulate this phone)</h3><select id="dv" onchange="S.ctx.device=this.value" style="margin-bottom:8px"><option ${S.ctx.device=='Pixel 7'?'selected':''}>Pixel 7</option><option ${S.ctx.device!='Pixel 7'?'selected':''}>Unknown Android</option></select><select onchange="S.ctx.city=this.value" style="margin-bottom:8px">${['Chennai','Delhi','Lagos'].map(c=>`<option ${S.ctx.city==c?'selected':''}>${c}</option>`).join('')}</select><input type="number" min="0" max="23" value="${S.ctx.hour}" onchange="S.ctx.hour=+this.value"></div>
<div class="card"><h3>Report a suspicious UPI ID</h3><input id="rv" placeholder="scammer@okxyz" style="margin-bottom:8px"><button class="btn y" onclick="rp()">Report</button></div>`}
async function tg(){await api('/api/settings',{guard:!S.me.guard.on});await load();draw()}
async function rp(){const x=await api('/api/report',{vpa:$('#rv').value,reason:'User report'});toast(x.msg)}
const loanTip=g=>g.loan&&g.loan.flag?'<div class="sms"><b>Real lenders never ask for money first.</b> Fees come out of the loan. If you already paid, call 1930 or report at cybercrime.gov.in.</div>':'';
const ord=n=>n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th';
const sw=(on,fn,dis,label)=>`<button class="sw${on?' on':''}" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}" ${dis?'disabled':''} onclick="${fn}"><i></i></button>`;
const dueIn=m=>m.days===0?'today':m.days===1?'tomorrow':`in ${m.days} days`;
function apCard(){const a=S.me.autopay,nx=a.items.filter(x=>x.on).sort((p,q)=>p.days-q.days)[0];
return `<div class="card st" style="--d:2"><div class="row"><div><b>Autopay</b><br><small style="color:var(--m)">${!a.on?'Off. You pay bills and EMIs yourself':nx?`Next: ${esc(nx.name)} ${inr(nx.amount)} on ${nx.next}`:'No bills or EMIs set up yet'}</small></div>${sw(a.on,'masterAuto(this)',false,'Autopay for all bills and EMIs')}</div><button class="lnk" onclick="go('auto')">Manage autopay</button></div>`}
function apRow(m,off){const k=m.kind==='EMI'?'EMI':'Bills';
return `<div class="li ap"><div class="av" style="background:var(--cb${k});color:var(--cf${k})">${ICO[k]}</div><div><b>${esc(m.name)}</b><small>${inr(m.amount)} on the ${m.day}${ord(m.day)} of every month</small><small>${m.on&&!off?`Next: ${m.next} (${dueIn(m)})`:'Paused'} · ${esc(m.bank)}</small><button class="lnk" onclick="rmAuto(${m.id})">Remove</button></div>${sw(m.on&&!off,`swAuto(${m.id},this)`,off,'Autopay for '+m.name)}</div>`}
function auto(){const a=S.me.autopay,bills=a.items.filter(m=>m.kind==='Bill'),emis=a.items.filter(m=>m.kind==='EMI'),n=a.items.filter(m=>m.on).length,off=!a.on;
return `<div class="hd"><button class="back" onclick="go('home')">← Back</button><h2>Autopay</h2><small>Bills and EMIs paid on their due date</small></div>
<div class="card"><div class="row"><div><b>Autopay</b><br><small style="color:var(--m)">${off?'Off. Nothing is paid automatically':`${n} of ${a.items.length} active`}</small></div>${sw(a.on,'masterAuto(this)',false,'Autopay for all bills and EMIs')}</div></div>
<h3 class="sec">Bills</h3><div class="card${off?' dim':''}">${bills.map(m=>apRow(m,off)).join('')||'<small>No bill autopay yet.</small>'}</div>
<h3 class="sec">EMIs</h3><div class="card${off?' dim':''}">${emis.map(m=>apRow(m,off)).join('')||'<small>No EMI autopay yet.</small>'}</div>
<div style="padding:6px 14px 0"><button class="btn" onclick="addAuto('Bill')">+ Add autopay</button></div>
<div class="card"><small style="color:var(--m)">Autopay is limited to ${inr(a.cap)} per payment. EMI autopay works only with registered lenders, and every payee is checked for fake loan signs.</small><br><button class="lnk" onclick="runAuto()">Demo: run due autopays now</button></div>`}
async function swAuto(id,el){const on=!el.classList.contains('on');el.classList.toggle('on',on);el.setAttribute('aria-checked',on);const r=await api('/api/autopay/toggle',{id,on});await wait(220);await load();draw();toast(r.ok?(on?'Autopay is on.':'Autopay is off.'):r.msg)}
async function masterAuto(el){const on=!el.classList.contains('on');el.classList.toggle('on',on);el.setAttribute('aria-checked',on);await api('/api/autopay/master',{on});await wait(220);await load();draw();toast(on?'Autopay is on for your bills and EMIs.':'Autopay is off. Nothing will be paid automatically.')}
async function rmAuto(id){await api('/api/autopay/delete',{id});await load();draw();toast('Autopay removed.')}
async function runAuto(){const r=await api('/api/autopay/run',{});if(!r.ok)return toast(r.msg);await load();draw();toast(!r.results.length?'Nothing is due right now.':`${r.paid} paid (${inr(r.total)}).${r.issue?' '+r.issue:''}`)}
function addAuto(kind){const a=S.me.autopay,list=kind==='EMI'?a.lenders:a.billers;S.ap={kind};$('#ov').className='on form';
$('#ov').innerHTML=`<div class="sh" role="dialog" aria-modal="true" aria-label="Add autopay"><div class="grab"></div><div class="row"><h2>Add autopay</h2><button class="x" onclick="closeOv()" aria-label="Close">✕</button></div>
<div class="seg" style="margin:12px 0 4px"><button class="${kind==='Bill'?'on':''}" onclick="addAuto('Bill')">Bill</button><button class="${kind==='EMI'?'on':''}" onclick="addAuto('EMI')">EMI</button></div>
<p class="sub">${kind==='EMI'?'EMI autopay works only with registered lenders. Every payee is checked for fake loan signs.':'Pay a bill automatically on the same day every month.'}</p>
<div class="chips2">${list.map(p=>`<button onclick="$('#at').value='${esc(p.vpa)}'">${esc(p.name)}</button>`).join('')}</div>
<input id="at" placeholder="UPI ID of the ${kind==='EMI'?'lender':'biller'}"><input id="aa" type="number" inputmode="decimal" placeholder="Amount (₹)"><select id="ad">${Array.from({length:28},(_,i)=>`<option value="${i+1}">Pay on the ${i+1}${ord(i+1)}</option>`).join('')}</select><select id="ab">${S.me.banks.map(b=>`<option>${b}</option>`).join('')}</select><input id="apin" type="password" inputmode="numeric" maxlength="4" placeholder="UPI PIN to approve"><div class="er" id="fe"></div><button class="btn" onclick="saveAuto()">Set up autopay</button></div>`}
async function saveAuto(){const r=await api('/api/autopay/add',{kind:S.ap.kind,to:$('#at').value,amount:$('#aa').value,day:+$('#ad').value,bank:$('#ab').value,pin:$('#apin').value});if(!r.ok){if(r.loan)alarm(true);return $('#fe').textContent=r.msg}await load();closeOv();draw();toast('Autopay set up for '+r.name+'.')}
function draw(){const m=S.me,v=S.v,V={lock,home,scan,amt,pin,res,hist,req,prof,auto,balv:()=>`<div class="hd"><button class="back" onclick="go('home')">← Done</button><h2>Your balances</h2></div>${Object.entries(S.bal||{}).map(([k,v],i)=>`<div class="card st" style="--d:${i}"><h3>${esc(k)}</h3><div class="big2">${cu(v,0)}</div></div>`).join('')}<div class="card st" style="--d:4"><small style="color:var(--m)">Balances hide again as soon as you leave this page.</small><br><button class="lnk" onclick="addBank()">+ Add bank account</button><button class="lnk" style="margin-left:14px" onclick="rs()">Reset demo money</button></div>`,bal:()=>`<div class="hd"><button class="back" onclick="go('home')">← Back</button><h2>Check balance</h2></div><p style="text-align:center;margin-top:20px">Enter UPI PIN</p>${dots()}<div class="er" id="er"></div>${pad()}`};
$('#scr').innerHTML=V[v]();countUps();const show=['home','hist','req','prof'].includes(v);$('#nv').style.display=show?'flex':'none';
if(show)$('#nv').innerHTML=[['home','Home'],['hist','History'],['scan','Scan'],['req','Requests'],['prof','Profile']].map(([k,l])=>`<button class="${v===k?'on':''}" onclick="${k==='hist'?'openHist()':"go('"+k+"')"}">${l}${k==='req'&&m.collect.length?`<b>${m.collect.length}</b>`:''}</button>`).join('');mon()}
async function mon(){const g=await api('/api/guardlog');$('#mon').innerHTML=`<h3>${g.demo?'Demo safety alerts':'PhishGuard extension'}</h3><p style="color:var(--m);margin:6px 0 12px;font-size:13px">${g.demo?'Simulated locally for every payment option. These are not real fraud checks.':'The PhishGuard service behind the app-debug.apk. Zippay calls it before every payment.'}</p><span class="shield ${g.online?'':'off'}">${g.demo?'Simulation active':g.online?'Connected':'Offline'}</span><div style="margin-top:12px">${g.log.map(l=>`<div class="li"><div><b>${esc(l.vpa)}</b><small>${l.time} · ${l.ms} ms</small></div><b>${l.score??'-'}</b></div>`).join('')||'<small style="color:var(--m)">No checks yet.</small>'}</div>`}
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('Zippay was added to your device.')});
window.addEventListener('pagehide',stopCamera);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(error=>console.error('Could not register the app service worker:',error));
$('#ov').addEventListener('click',e=>{const o=e.currentTarget;if(e.target===o&&(o.classList.contains('sheet')||o.classList.contains('form')))closeOv()});
draw();setInterval(mon,4000);
</script></body></html>
